<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ — IndustrCons Skills Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header" class="site-header"></header>

<div class="detail-hero">
  <div class="wrap">
    <span class="pill">FAQ</span>
    <h1 data-i18n="faq_title"></h1>
  </div>
</div>

<section>
  <div class="wrap" style="max-width:760px;">
    <div class="stack" id="faq-list"></div>
  </div>
</section>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  document.documentElement.lang = getLang();
  initShell('faq');

  const items = [
    ['faq_q1','faq_a1'], ['faq_q2','faq_a2'], ['faq_q3','faq_a3'],
    ['faq_q4','faq_a4'], ['faq_q5','faq_a5'], ['faq_q6','faq_a6']
  ];
  const list = document.getElementById('faq-list');
  items.forEach(([q, a]) => {
    const div = document.createElement('div');
    div.className = 'block';
    div.innerHTML = `<h2>${t(q)}</h2><p>${t(a)}</p>`;
    list.appendChild(div);
  });
</script>
</body>
</html>
