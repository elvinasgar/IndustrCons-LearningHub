<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programs — IndustrCons Learning Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header" class="site-header"></header>

<section style="padding-top:44px;">
  <div class="wrap">
    <div class="section-head">
      <h2 data-i18n="programs_title"></h2>
      <p data-i18n="programs_sub"></p>
    </div>
    <div class="card-grid" id="program-cards"></div>
  </div>
</section>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  document.documentElement.lang = getLang();
  initShell('programs');

  const grid = document.getElementById('program-cards');
  DB.programs.forEach(p => {
    const a = document.createElement('a');
    a.className = 'tb-card';
    a.href = `program.html?id=${p.id}`;
    a.innerHTML = `
      <div class="tb-corner tl"></div><div class="tb-corner br"></div>
      <div class="tb-code">${p.code}</div>
      <h3>${p.title[getLang()]}</h3>
      <p class="desc">${p.description[getLang()]}</p>
      <div class="tb-stamp">
        <div><span class="k">${t('program_hours')}</span>${p.hours}</div>
        <div><span class="k">${t('program_subjects')}</span>${p.subjects.length}</div>
        <div><span class="k">Level</span>${p.level}</div>
      </div>`;
    grid.appendChild(a);
  });
</script>
</body>
</html>
