<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IndustrCons Learning Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header" class="site-header"></header>

<section class="hero">
  <div class="wrap">
    <div class="eyebrow" data-i18n="hero_eyebrow"></div>
    <h1 data-i18n="hero_title"></h1>
    <p class="sub" data-i18n="hero_sub"></p>
    <div class="hero-ctas">
      <a class="btn btn-primary" href="programs.html" data-i18n="hero_cta_primary"></a>
      <a class="btn btn-ghost" href="#how" data-i18n="hero_cta_secondary"></a>
    </div>
    <p class="hero-note" data-i18n="hero_note"></p>
  </div>
</section>

<section id="how">
  <div class="wrap">
    <div class="section-head">
      <h2 data-i18n="how_title"></h2>
    </div>
    <div class="how-grid">
      <div class="how-item"><div class="how-num">01</div><h3 data-i18n="how_1_t"></h3><p data-i18n="how_1_d"></p></div>
      <div class="how-item"><div class="how-num">02</div><h3 data-i18n="how_2_t"></h3><p data-i18n="how_2_d"></p></div>
      <div class="how-item"><div class="how-num">03</div><h3 data-i18n="how_3_t"></h3><p data-i18n="how_3_d"></p></div>
      <div class="how-item"><div class="how-num">04</div><h3 data-i18n="how_4_t"></h3><p data-i18n="how_4_d"></p></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="section-head">
      <h2 data-i18n="programs_title"></h2>
      <p data-i18n="programs_sub"></p>
    </div>
    <div class="card-grid" id="program-cards"></div>
    <div class="center" style="margin-top:30px;">
      <a class="btn btn-ghost" href="programs.html" id="see-all-link" style="border-color:var(--line);color:var(--graphite);"></a>
    </div>
  </div>
</section>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  document.documentElement.lang = getLang();
  initShell('home');

  const grid = document.getElementById('program-cards');
  const starterIds = ['cpm', 'qaqc', 'cost'];
  DB.programs.filter(p => starterIds.includes(p.id)).forEach(p => {
    const a = document.createElement('a');
    a.className = 'tb-card';
    a.href = `program.html?id=${p.id}`;
    a.innerHTML = `
      <div class="tb-corner tl"></div><div class="tb-corner br"></div>
      <div class="tb-code">${p.code}</div>
      <h3>${p.title[getLang()]}</h3>
      <p class="desc">${p.tagline[getLang()]}</p>
      <div class="tb-stamp">
        <div><span class="k">${t('program_hours')}</span>${p.hours}</div>
        <div><span class="k">${t('program_subjects')}</span>${p.subjects.length}</div>
        <div><span class="k">Level</span>${p.level}</div>
      </div>`;
    grid.appendChild(a);
  });
  const seeAll = document.getElementById('see-all-link');
  seeAll.textContent = getLang() === 'en'
    ? `See all ${DB.programs.length} programs`
    : `Bütün ${DB.programs.length} proqrama bax`;
</script>
</body>
</html>
